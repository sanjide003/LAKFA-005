<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lakfa ERP</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <!-- Favicon / Touch Icons -->
  <link rel="icon" type="image/png" href="assets/logo.png" fallback="text">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img data-company-logo hidden alt="Company logo" style="width: 72px; height: 72px; object-fit: contain; margin: 0 auto 0.75rem; display: block;">
        <div class="login-logo" data-company-name>Lakfa ERP</div>
        <div class="login-subtitle">Food Business Operations Management</div>
      </div>

      <!-- Error Message Banner -->
      <div id="error-alert" class="alert alert-error d-none">
        <span id="error-text">Incorrect credentials. Please try again.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="username@lakfa.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-btn" class="btn-primary" style="width: 100%; margin-top: 1.5rem;">
          Sign In
        </button>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="text-center mt-4 d-none" style="font-size: 0.875rem; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
          <span class="icon animate-spin" aria-hidden="true" style="color: var(--primary);"><svg viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></svg></span>
          <span>Verifying credentials, please wait...</span>
        </div>
      </form>

      <div class="login-footer-note" style="display: flex; align-items: center; justify-content: center; gap: 0.25rem;">
        <span class="icon" aria-hidden="true" style="color: var(--text-muted); width: 14px; height: 14px;"><svg viewBox="0 0 24 24" style="width: 14px; height: 14px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
        <span>Authorized personnel only. All access logged.</span>
      </div>
    </div>
  </div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registered successfully!', reg.scope))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>

  <!-- JS Modules -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/role-guard.js"></script>
  <script type="module" src="js/firebase-db.js"></script>
  <script type="module" src="js/company-profile.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
